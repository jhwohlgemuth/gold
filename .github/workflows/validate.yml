name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned shell tools
        id: tools
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl --fail --silent --show-error --location \
            https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 -o shfmt
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o shellcheck.tar.xz
          printf '%s  %s\n' \
            d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea shfmt \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 shellcheck.tar.xz \
            | sha256sum --check
          tar -xJf shellcheck.tar.xz
          mkdir -p "${RUNNER_TEMP}/validation-bin"
          install -m 0755 shfmt shellcheck-v0.11.0/shellcheck "${RUNNER_TEMP}/validation-bin/"
          echo "${RUNNER_TEMP}/validation-bin" >> "${GITHUB_PATH}"
      - name: Check shell formatting
        run: |
          set -euo pipefail
          shfmt -d provision/healthcheck provision/terminal/*.sh provision/notebook/*.sh provision/gold/*.sh
          shfmt -d config/code-server/service/run config/code-server/service/finish
      - name: Analyze shell scripts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          shellcheck provision/healthcheck provision/terminal/*.sh provision/notebook/*.sh provision/gold/*.sh
          # s6's with-contenv shebang is a launcher for Bash.
          shellcheck --shell=bash config/code-server/service/run
          shellcheck config/code-server/service/finish

  dockerfiles:
    name: Dockerfile validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Hadolint
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl --fail --silent --show-error --location \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 -o hadolint
          printf '%s  %s\n' \
            c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507 hadolint \
            | sha256sum --check
          chmod 0755 hadolint
      - name: Analyze Dockerfiles
        # Keep informational/style diagnostics visible; warnings and errors fail CI.
        run: '"${RUNNER_TEMP}/hadolint" --failure-threshold warning Dockerfile Dockerfile.terminal Dockerfile.notebook'

  configuration:
    name: Configuration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.11'
      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check 'checkov==3.2.471'
      - name: Analyze configuration
        # Override the local soft-fail setting: policy failures must fail CI.
        env:
          CKV_PARSE_ERROR_FAIL: 'true'
        run: checkov --config-file .checkov.yaml --hard-fail-on '*' --skip-download
